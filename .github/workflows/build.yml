name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip
            echo "Source unzipped successfully!"
          fi

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Assets
        run: |
          mkdir -p src/utils
          echo "export async function downloadProjectZip() {}" > src/utils/projectExporter.ts
          npm install --legacy-peer-deps
          npm run build
          mkdir -p android/app/src/main/assets/dist
          cp -r dist/* android/app/src/main/assets/
          cp -r dist/* android/app/src/main/assets/dist/

      - name: Fix Android Source & Config
        run: |
          # 1. Fix AIDL primitive types
          if [ -f android/app/src/main/aidl/net/osmand/aidl/IOsmAndAidlInterface.aidl ]; then
            sed -i 's/in boolean/boolean/g' android/app/src/main/aidl/net/osmand/aidl/IOsmAndAidlInterface.aidl
            sed -i 's/in double/double/g' android/app/src/main/aidl/net/osmand/aidl/IOsmAndAidlInterface.aidl
          fi
          # 2. Ensure Android SDK path and licenses
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build Android APK
        working-directory: ./android
        run: gradle assembleDebug -x lint -x test --no-daemon --stacktrace

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: OsmAnd-Route-Companion-APK
          path: android/app/build/outputs/apk/debug/*.apk
