
name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Verify Garbage Route APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Select the exact source ZIP
      - name: Select and Validate Source
        shell: bash
        run: |
          set -euo pipefail

          echo "Commit: $GITHUB_SHA"
          echo "Run ID: $GITHUB_RUN_ID"

          ARCHIVE="Garbage_Route_Source.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: $ARCHIVE was not found."
            exit 1
          fi

          SOURCE_ARCHIVE_SHA=$(sha256sum "$ARCHIVE" | awk '{print $1}')
          echo "SOURCE_ARCHIVE_SHA=$SOURCE_ARCHIVE_SHA" >> "$GITHUB_ENV"

          echo "Source ZIP SHA256: $SOURCE_ARCHIVE_SHA"

          rm -rf /tmp/garbage-route-source
          mkdir -p /tmp/garbage-route-source

          unzip -q "$ARCHIVE" -d /tmp/garbage-route-source

          SOURCE_ROOT="/tmp/garbage-route-source"

          # Find the actual project root inside the ZIP.
          if [ ! -f "$SOURCE_ROOT/package.json" ]; then
            PACKAGE_FILE=$(find "$SOURCE_ROOT" -mindepth 2 -maxdepth 5 -name package.json -print -quit)

            if [ -z "$PACKAGE_FILE" ]; then
              echo "ERROR: package.json was not found in source ZIP."
              exit 1
            fi

            SOURCE_ROOT=$(dirname "$PACKAGE_FILE")
          fi

          echo "Selected source root: $SOURCE_ROOT"

          test -f "$SOURCE_ROOT/package.json"
          test -f "$SOURCE_ROOT/vite.config.ts"
          test -d "$SOURCE_ROOT/src"
          test -d "$SOURCE_ROOT/android"

          # Copy source into repository while preserving GitHub workflow.
          rsync -a --delete \
            --exclude='.github/' \
            "$SOURCE_ROOT/" ./

          echo "Source extraction and validation successful."

      # 3. Configure Java
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      # 4. Configure Node
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 5. Install dependencies
      - name: Install Web Dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      # 6. Build web application
      # IMPORTANT: --base=./ forces relative asset paths.
      - name: Build Web Application
        shell: bash
        run: |
          set -euo pipefail

          echo "Building Garbage Route web application..."

          npm run build -- --base=./

          if [ ! -f dist/index.html ]; then
            echo "ERROR: Vite did not generate dist/index.html."
            exit 1
          fi

          echo "=== Generated HTML ==="
          cat dist/index.html

          # Reject absolute asset paths.
          if grep -Eq '(src|href)="/assets/' dist/index.html; then
            echo "ERROR: Absolute /assets/ paths detected."
            exit 1
          fi

          # Require relative JavaScript and CSS paths.
          grep -Eq 'src="\./assets/[^"]+\.js"' dist/index.html
          grep -Eq 'href="\./assets/[^"]+\.css"' dist/index.html

          echo "Relative JavaScript and CSS paths verified."

          # Check that every referenced asset exists.
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const html = fs.readFileSync('dist/index.html', 'utf8');

          const refs = [
            ...html.matchAll(/(?:src|href)="\.\/([^"]+)"/g)
          ]
            .map(match => match[1])
            .filter(path => path.startsWith('assets/'));

          if (refs.length < 2) {
            throw new Error('Expected JavaScript and CSS references were not found.');
          }

          for (const ref of refs) {
            if (!fs.existsSync(`dist/${ref}`)) {
              throw new Error(`Missing asset: dist/${ref}`);
            }

            console.log(`Verified: dist/${ref}`);
          }
          NODE

      # 7. Copy web application into Android assets
      - name: Package Web Assets
        shell: bash
        run: |
          set -euo pipefail

          DEST="android/app/src/main/assets/dist"

          rm -rf android/app/src/main/assets
          mkdir -p "$DEST"

          cp -a dist/. "$DEST/"

          test -f "$DEST/index.html"

          cat > "$DEST/build-info.txt" <<EOF
          commit=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          run_number=$GITHUB_RUN_NUMBER
          source_archive_sha256=$SOURCE_ARCHIVE_SHA
          EOF

          echo "Android web assets copied successfully."

          echo "=== Packaged HTML ==="
          cat "$DEST/index.html"

          grep -Eq 'src="\./assets/[^"]+\.js"' "$DEST/index.html"
          grep -Eq 'href="\./assets/[^"]+\.css"' "$DEST/index.html"

      # 8. Configure Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
          cache-disabled: true

      # 9. Build Android APK
      - name: Build Android APK
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail

          gradle assembleDebug \
            -x lint \
            -x test \
            --no-daemon \
            --stacktrace

      # 10. Verify actual APK
      - name: Verify APK Web Assets
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p /tmp/garbage-route-apk

          unzip -q "$APK" -d /tmp/garbage-route-apk

          APK_HTML="/tmp/garbage-route-apk/assets/dist/index.html"

          if [ ! -f "$APK_HTML" ]; then
            echo "ERROR: APK does not contain assets/dist/index.html."
            exit 1
          fi

          echo "=== APK HTML ==="
          cat "$APK_HTML"

          if grep -Eq '(src|href)="/assets/' "$APK_HTML"; then
            echo "ERROR: APK contains absolute asset paths."
            exit 1
          fi

          grep -Eq 'src="\./assets/[^"]+\.js"' "$APK_HTML"
          grep -Eq 'href="\./assets/[^"]+\.css"' "$APK_HTML"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const root = '/tmp/garbage-route-apk/assets/dist';
          const html = fs.readFileSync(`${root}/index.html`, 'utf8');

          const refs = [
            ...html.matchAll(/(?:src|href)="\.\/([^"]+)"/g)
          ]
            .map(match => match[1])
            .filter(path => path.startsWith('assets/'));

          for (const ref of refs) {
            if (!fs.existsSync(`${root}/${ref}`)) {
              throw new Error(`APK is missing ${ref}`);
            }

            console.log(`APK verified: ${ref}`);
          }

          if (!fs.existsSync(`${root}/build-info.txt`)) {
            throw new Error('APK build information is missing.');
          }

          console.log(fs.readFileSync(`${root}/build-info.txt`, 'utf8'));
          NODE

          echo "SUCCESS: APK asset verification passed."

      # 11. Upload APK
      - name: Upload Ready-to-Install APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Garbage-Route-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # 12. Upload diagnostic files
      - name: Upload Build Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Garbage-Route-Build-Diagnostics
          path: |
            dist/index.html
            android/app/src/main/assets/dist/index.html
            android/app/src/main/assets/dist/build-info.txt
          if-no-files-found: ignore
          retention-days: 14
