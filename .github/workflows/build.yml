name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip
            echo "Source unzipped successfully!"
          fi

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Application
        run: |
          mkdir -p src/utils
          echo "export async function downloadProjectZip() {}" > src/utils/projectExporter.ts
          npm install --legacy-peer-deps
          npx vite build --base=./
          mkdir -p android/app/src/main/assets/dist
          cp -r dist/* android/app/src/main/assets/dist/
          cp -r dist/* android/app/src/main/assets/

